<!-- SMB Fields -->
<div id="smb-fields" class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            SMB Server Host
        </label>
        <input type="text"
               name="provider_config[host]"
               {% if config %}value="{{ config.host or '' }}"{% endif %}
               placeholder="server.example.com"
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Share Name
        </label>
        <input type="text"
               name="provider_config[share_name]"
               {% if config %}value="{{ config.share_name or '' }}"{% endif %}
               placeholder="backup-share"
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Username
        </label>
        <input type="text"
               name="provider_config[user]"
               value="{{ config.user or 'guest' if config else 'guest' }}"
               placeholder="guest"
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Password (optional)
        </label>
        <input type="password"
               name="provider_config[pass]"
               {% if config %}value="{{ config.pass or '' }}" placeholder="Current value will be used if left empty"{% endif %}
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">Port</label>
        <input type="number"
               name="provider_config[port]"
               value="{{ config.port or 445 if config else 445 }}"
               placeholder="445"
               min="1"
               max="65535"
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Domain
        </label>
        <input type="text"
               name="provider_config[domain]"
               value="{{ config.domain or 'WORKGROUP' if config else 'WORKGROUP' }}"
               placeholder="WORKGROUP"
               class="input-modern mt-1">
    </div>
    <!-- Advanced Options -->
    <details class="mt-4"
             {% if config and (config.spn or config.use_kerberos or config.kerberos_ccache or (config.idle_timeout and config.idle_timeout != '1m0s') or config.hide_special_share == false or config.case_insensitive == false) %}open{% endif %}>
        <summary class="cursor-pointer text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100">
            Advanced Options
        </summary>
        <div class="mt-3 space-y-3 border-l-2 border-gray-200 dark:border-gray-700 pl-4">
            <div>
                <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
                    Service Principal Name (SPN)
                </label>
                <input type="text"
                       name="provider_config[spn]"
                       {% if config %}value="{{ config.spn or '' }}"{% endif %}
                       placeholder="cifs/remotehost:1020"
                       class="input-modern mt-1">
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                    Required for some cluster configurations
                </p>
            </div>
            <div class="flex items-center">
                <input type="checkbox"
                       name="provider_config[use_kerberos]"
                       value="true"
                       {% if config and config.use_kerberos %}checked{% endif %}
                       class="checkbox-modern">
                <label class="ml-2 text-sm text-gray-900 dark:text-gray-100">
                    Use Kerberos Authentication
                </label>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
                    Kerberos Credential Cache Path
                </label>
                <input type="text"
                       name="provider_config[kerberos_ccache]"
                       {% if config %}value="{{ config.kerberos_ccache or '' }}"{% endif %}
                       placeholder="/path/to/ccache or FILE:/path/to/ccache"
                       class="input-modern mt-1">
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                    Only needed if not using default location
                </p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
                    Idle Timeout
                </label>
                <input type="text"
                       name="provider_config[idle_timeout]"
                       value="{{ config.idle_timeout or '1m0s' if config else '1m0s' }}"
                       placeholder="1m0s"
                       class="input-modern mt-1">
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                    Format: 30s, 1m0s, 2h, etc.
                </p>
            </div>
            <div class="flex items-center">
                <input type="checkbox"
                       name="provider_config[hide_special_share]"
                       value="true"
                       {% if not config or config.hide_special_share != false %}checked{% endif %}
                       class="checkbox-modern">
                <label class="ml-2 text-sm text-gray-900 dark:text-gray-100">
                    Hide Special Shares (print$, etc.)
                </label>
            </div>
            <div class="flex items-center">
                <input type="checkbox"
                       name="provider_config[case_insensitive]"
                       value="true"
                       {% if not config or config.case_insensitive != false %}checked{% endif %}
                       class="checkbox-modern">
                <label class="ml-2 text-sm text-gray-900 dark:text-gray-100">Case Insensitive</label>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                    Always true on Windows shares
                </p>
            </div>
        </div>
    </details>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Path Prefix (optional)
        </label>
        <input type="text"
               name="path_prefix"
               {% if config %}value="{{ config.path_prefix or '' }}"{% endif %}
               placeholder="backups/borgitory"
               class="input-modern mt-1">
    </div>
</div>
