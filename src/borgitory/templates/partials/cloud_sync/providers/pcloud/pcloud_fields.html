<!-- pCloud Fields -->
<div id="pcloud-fields" class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            OAuth Token (JSON)
        </label>
        <textarea name="provider_config[token]"
                  placeholder='{"access_token":"...","token_type":"bearer","expiry":"..."}'
                  rows="4"
                  class="input-modern mt-1"></textarea>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
            Get the token by running <code>rclone config</code>, choose pcloud, complete OAuth in the browser, then run <code>rclone config show remote</code> and copy the token value.
        </p>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Hostname
        </label>
        <select name="provider_config[hostname]" class="select-modern mt-1">
            <option value="api.pcloud.com">api.pcloud.com (US)</option>
            <option value="eapi.pcloud.com">eapi.pcloud.com (EU)</option>
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Root Folder ID (optional)
        </label>
        <input type="text"
               name="provider_config[root_folder_id]"
               placeholder="d0"
               class="input-modern mt-1">
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
            Leave blank for account root. Use <code>rclone lsf --dirs-only -Fip --csv remote:</code> to find folder IDs.
        </p>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Path Prefix (optional)
        </label>
        <input type="text"
               name="path_prefix"
               placeholder="backups/borgitory"
               class="input-modern mt-1">
    </div>
</div>
