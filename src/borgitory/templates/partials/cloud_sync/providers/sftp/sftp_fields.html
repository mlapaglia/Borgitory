<!-- SFTP Fields -->
<div id="sftp-fields" class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">Host</label>
        <input type="text"
               name="provider_config[host]"
               {% if config %}value="{{ config.host or '' }}"{% endif %}
               placeholder="sftp.example.com"
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">Port</label>
        <input type="number"
               name="provider_config[port]"
               value="{{ config.port or 22 if config else 22 }}"
               placeholder="22"
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Username
        </label>
        <input type="text"
               name="provider_config[username]"
               {% if config %}value="{{ config.username or '' }}"{% endif %}
               placeholder="backup-user"
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Remote Path
        </label>
        <input type="text"
               name="provider_config[remote_path]"
               {% if config %}value="{{ config.remote_path or '' }}"{% endif %}
               placeholder="/backups"
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Password (optional if using private key)
        </label>
        <input type="password"
               name="provider_config[password]"
               {% if config %}value="{{ config.password or '' }}" placeholder="Current value will be used if left empty"{% else %}placeholder="Leave empty if using private key"{% endif %}
               class="input-modern mt-1">
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Private Key (optional if using password)
        </label>
        <textarea name="provider_config[private_key]"
                  rows="6"
                  class="input-modern mt-1"
                  placeholder="{% if config %}Current value will be used if left empty{% else %}-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----{% endif %}">{{ config.private_key or '' if config else '' }}</textarea>
        {% if config %}
            <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
                Current private key will be used if left empty.
            </p>
        {% endif %}
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Host Key Checking
        </label>
        <select name="provider_config[host_key_checking]" class="select-modern mt-1">
            <option value="true"
                    {% if config and config.host_key_checking %}selected{% endif %}>
                Enabled (Recommended)
            </option>
            <option value="false"
                    {% if config and not config.host_key_checking %}selected{% endif %}>
                Disabled
            </option>
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Server-Side Checksums
        </label>
        <select name="provider_config[disable_server_side_checksums]"
                class="select-modern mt-1">
            <option value="false"
                    {% if not config or not config.disable_server_side_checksums %}selected{% endif %}>
                Enabled (Recommended)
            </option>
            <option value="true"
                    {% if config and config.disable_server_side_checksums %}selected{% endif %}>
                Disabled (for restricted SFTP servers, e.g. Ugreen NAS)
            </option>
        </select>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
            Disable if your SFTP server does not allow remote command execution (md5sum/sha1sum).
        </p>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Path Prefix (optional)
        </label>
        <input type="text"
               name="path_prefix"
               {% if config %}value="{{ config.path_prefix or '' }}"{% endif %}
               placeholder="backups/borgitory"
               class="input-modern mt-1">
    </div>
</div>
