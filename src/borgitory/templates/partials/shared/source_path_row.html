<!-- Single source path row; requires input_id, input_value, placeholder -->
<div class="flex items-start gap-2" data-source-path-row>
    <div class="flex-1">
        {% set input_name = "source_paths" %}
        {% set required = false %}
        {% include "partials/shared/path_autocomplete.html" %}
    </div>
    <!-- Removes the row, or clears it when it is the last one -->
    <button type="button"
            class="mt-2 text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 p-1 rounded-md hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors"
            title="Remove path"
            hx-on:click=" const row = this.closest('[data-source-path-row]'); if (row.parentElement.querySelectorAll('[data-source-path-row]').length > 1) { row.remove(); } else { row.querySelector('input').value = ''; } ">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
            </path>
        </svg>
    </button>
</div>
