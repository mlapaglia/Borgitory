<!-- Source Paths Save Response - Updates parent form and closes modal -->
<!-- Close the modal -->
<div id="modal-container" hx-swap-oob="innerHTML"></div>
<!-- Update parent form hidden field via OOB swap -->
<input type="hidden"
       name="source_paths"
       id="source-paths-data"
       value="{{ source_paths_json if source_paths_json else '[]' }}"
       hx-swap-oob="true">
<!-- Update the entire button to ensure proper layout -->
<button type="button"
        class="flex items-stretch w-full text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 transition-colors overflow-hidden"
        hx-post="/api/schedules/source-paths/source-paths-modal"
        hx-include="#source-paths-data"
        hx-target="#modal-container"
        hx-swap-oob="outerHTML:[hx-post*='source-paths-modal']">
    <span class="flex-1 px-4 py-2 text-left" id="source-paths-button-text">Source Paths</span>
    {% if total_count > 0 %}
        <span class="flex items-center justify-center px-3 bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 border-l border-gray-300 dark:border-gray-600 text-xs font-medium min-w-[2rem]"
              id="source-paths-count-badge">{{ total_count }}</span>
    {% else %}
        <span class="flex items-center justify-center px-3 bg-gray-100 dark:bg-gray-700 border-l border-gray-300 dark:border-gray-600 text-xs font-medium min-w-[2rem]"
              id="source-paths-count-badge">{{ total_count }}</span>
    {% endif %}
</button>
