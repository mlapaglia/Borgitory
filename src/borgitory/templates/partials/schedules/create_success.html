<!-- HTMX Notification Trigger -->
<div hx-get="/api/shared/notification?message=Schedule created successfully!&type=success"
     hx-target="body"
     hx-swap="beforeend"
     hx-trigger="load"></div>
<!-- Trigger schedule list refresh -->
<div hx-trigger="load"
     hx-swap="none"
     hx-on::load="document.body.dispatchEvent(new CustomEvent('scheduleUpdate'))">
</div>
<!-- Restore fresh create form -->
<div hx-get="/api/schedules/form"
     hx-target="#schedule-form-container"
     hx-swap="innerHTML"
     hx-trigger="load delay:100ms"></div>
