<!-- Manual Apprise URL Fields -->
<div class="space-y-4">
    <div>
        <label for="notification-urls"
               class="block text-sm font-medium text-gray-900 dark:text-gray-100">
            Apprise URLs
            {% if not masked_urls %}<span class="text-red-500">*</span>{% endif %}
        </label>
        <textarea id="notification-urls"
                  name="urls"
                  rows="3"
                  autocomplete="off"
                  spellcheck="false"
                  {% if masked_urls %}placeholder="Leave blank to keep the current URLs"{% else %}placeholder="ntfys://ntfy.sh/my-topic"{% endif %}
                  class="input-modern mt-1 font-mono"
                  {% if not masked_urls %}required{% endif %}></textarea>
        <p class="mt-1 text-xs text-gray-600 dark:text-gray-400">
            One URL per line. Any
            <a href="https://github.com/caronc/apprise#supported-notifications"
               target="_blank"
               rel="noopener noreferrer"
               class="text-blue-600 dark:text-blue-400 hover:underline">Apprise URL</a>
            works here, including <code>apprise://</code> URLs for a self-hosted Apprise API server.
        </p>
    </div>
    {% if masked_urls %}
        <div class="text-xs text-gray-600 dark:text-gray-400">
            <p class="font-medium">Current URLs</p>
            <ul class="mt-1 ml-4 list-disc font-mono break-all">
                {% for url in masked_urls %}<li>{{ url }}</li>{% endfor %}
            </ul>
        </div>
    {% endif %}
</div>
