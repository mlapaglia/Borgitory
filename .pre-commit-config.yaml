repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: 6eaad039603a4de39fddd1cf5f727391efe9974e # v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 38980559e3a605691d6579f96222c30778e5a69e # 3.0.0
  hooks:
  - id: shellcheck
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: b969e2851312ca2b24bbec879ba4954341d1bd12 # v0.15.5
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: a66e98df7b4aeeb3724184b332785976d062b92e # v1.19.1
  hooks:
  - id: mypy
    additional_dependencies: [types-requests, pydantic, sqlalchemy]
- repo: https://github.com/djlint/djLint
  rev: 9112cb64851c95a7802358af285d21ad8b7f6437 # v1.36.4
  hooks:
  - id: djlint-reformat-django
  - id: djlint-django
