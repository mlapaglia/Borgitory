name: Build and Test

permissions:
  contents: read

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: mlapaglia/borgitory

jobs:
  prepare-test-images:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build test image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        target: test
        platforms: ${{ matrix.platform }}
        load: true
        push: false
        tags: borgitory-test-${{ matrix.arch }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

    - name: Save Docker image
      run: docker save borgitory-test-${{ matrix.arch }} > /tmp/borgitory-test-${{ matrix.arch }}.tar

    - name: Upload Docker image
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: docker-test-${{ matrix.arch }}
        path: /tmp/borgitory-test-${{ matrix.arch }}.tar
        retention-days: 1

  code-quality-lint:
    runs-on: ubuntu-latest
    needs: prepare-test-images
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
    
    - name: Download test image
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: docker-test-x86_64
        path: /tmp
    
    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-x86_64.tar
    
    - name: Run Python linting
      run: |
        docker run --rm -v $(pwd):/workspace -w /workspace borgitory-test-x86_64 python lint.py check
    
    - name: Run HTML linting
      run: |
        docker run --rm -v $(pwd):/workspace -w /workspace borgitory-test-x86_64 python lint.py html

  code-quality-types:
    runs-on: ubuntu-latest
    needs: prepare-test-images
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
    
    - name: Download test image
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: docker-test-x86_64
        path: /tmp
    
    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-x86_64.tar
    
    - name: Run type checking
      run: |
        docker run --rm -v $(pwd):/workspace -w /workspace borgitory-test-x86_64 python lint.py mypy

  test-unit:
    runs-on: ${{ matrix.os }}
    needs: prepare-test-images
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
    
    - name: Download test image
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: docker-test-${{ matrix.arch }}
        path: /tmp
    
    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-${{ matrix.arch }}.tar
    
    - name: Run unit tests
      run: |
        docker run --rm \
          --cap-add SYS_ADMIN \
          --device /dev/fuse:/dev/fuse:rwm \
          -v $(pwd):/app \
          -w /app \
          borgitory-test-${{ matrix.arch }} \
          sh -c "pip install -e .[dev] && pytest tests/ --ignore=tests/integration \
            --cov=src/borgitory \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml \
            -o junit_family=legacy"

    - name: Upload unit test coverage to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
      with:
        files: ./coverage.xml
        flags: unit
        name: unit-tests
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    runs-on: ${{ matrix.os }}
    needs: prepare-test-images
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
    
    - name: Download test image
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: docker-test-${{ matrix.arch }}
        path: /tmp
    
    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-${{ matrix.arch }}.tar
    
    - name: Run integration tests with coverage
      run: |
        docker run --rm \
          --cap-add SYS_ADMIN \
          --device /dev/fuse:/dev/fuse:rwm \
          -v $(pwd):/app \
          -w /app \
          borgitory-test-${{ matrix.arch }} \
          pytest tests/integration/ -v --tb=short \
            --cov=src/borgitory \
            --cov-report=xml:integration-coverage.xml \
            --cov-report=html:integration-htmlcov \
            --cov-append

    - name: Upload integration test coverage to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
      with:
        files: ./integration-coverage.xml
        flags: integration
        name: integration-tests
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  build-python-packages:
    runs-on: ${{ matrix.os }}
    needs: [code-quality-lint, code-quality-types, test-unit, test-integration]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: x86_64

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
    
    - name: Install system dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc \
          pkg-config \
          libfuse3-dev
    
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.14'
    
    - name: Build Tailwind CSS
      run: python build_tailwind.py

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package with twine
      run: twine check dist/*
    
    - name: Test package installation (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        python -m venv test_env
        source test_env/bin/activate
        
        pip install dist/*.whl

        borgitory --version
        borgitory --help
    
    - name: Test package installation (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        python -m venv test_env
        test_env\Scripts\Activate.ps1

        $whl = Get-ChildItem -Path "dist\*.whl" | Select-Object -First 1
        pip install $whl.FullName

        borgitory --version
        borgitory --help

  build-docker-images:
    runs-on: ${{ matrix.os }}
    needs: [code-quality-lint, code-quality-types, test-unit, test-integration]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Build production image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: false
        load: false
        tags: borgitory-production-${{ matrix.arch }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
