name: Build and Test

permissions:
  contents: read

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: mlapaglia/borgitory

jobs:
  prepare-test-images:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build test image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        target: test
        platforms: ${{ matrix.platform }}
        load: true
        push: false
        tags: borgitory-test-${{ matrix.arch }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

    - name: Save Docker image
      run: docker save borgitory-test-${{ matrix.arch }} > /tmp/borgitory-test-${{ matrix.arch }}.tar

    - name: Upload Docker image
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: docker-test-${{ matrix.arch }}
        path: /tmp/borgitory-test-${{ matrix.arch }}.tar
        retention-days: 1

  code-quality-lint:
    runs-on: ubuntu-latest
    needs: prepare-test-images

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 2

    - name: Download test image
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: docker-test-x86_64
        path: /tmp

    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-x86_64.tar

    - name: Run Python linting
      run: |
        docker run --rm -v $(pwd):/workspace -w /workspace borgitory-test-x86_64 python lint.py check

    - name: Run HTML linting
      run: |
        docker run --rm -v $(pwd):/workspace -w /workspace borgitory-test-x86_64 python lint.py html

  code-quality-types:
    runs-on: ubuntu-latest
    needs: prepare-test-images

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 2

    - name: Download test image
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: docker-test-x86_64
        path: /tmp

    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-x86_64.tar

    - name: Run type checking
      run: |
        docker run --rm -v $(pwd):/workspace -w /workspace borgitory-test-x86_64 python lint.py mypy

  test-unit:
    runs-on: ${{ matrix.os }}
    needs: prepare-test-images
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 2

    - name: Download test image
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: docker-test-${{ matrix.arch }}
        path: /tmp

    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-${{ matrix.arch }}.tar

    - name: Run unit tests with coverage
      run: |
        docker run --rm \
          --cap-add SYS_ADMIN \
          --device /dev/fuse:/dev/fuse:rwm \
          -v $(pwd):/app \
          -w /app \
          borgitory-test-${{ matrix.arch }} \
          pytest tests/unit/ -v \
            --tb short \
            --cov src/borgitory \
            --cov-report xml:coverage.xml \
            --junitxml junit.xml \
            --override-ini junit_family=legacy

    - name: Upload unit test coverage to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        flags: unit
        name: unit-tests
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload unit test results to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        flags: unit
        name: unit-tests-results
        report_type: test_results
        token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    runs-on: ${{ matrix.os }}
    needs: prepare-test-images
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 2

    - name: Download test image
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: docker-test-${{ matrix.arch }}
        path: /tmp

    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-${{ matrix.arch }}.tar

    - name: Run integration tests with coverage
      run: |
        docker run --rm \
          --cap-add SYS_ADMIN \
          --device /dev/fuse:/dev/fuse:rwm \
          -v $(pwd):/app \
          -w /app \
          borgitory-test-${{ matrix.arch }} \
          pytest tests/integration/ -v \
            --tb short \
            --cov src/borgitory \
            --cov-report xml:integration-coverage.xml \
            --junitxml junit.xml \
            --override-ini junit_family=legacy

    - name: Upload integration test coverage to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        flags: integration
        name: integration-tests
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload integration test results to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        flags: integration
        name: integration-tests-results
        report_type: test_results
        token: ${{ secrets.CODECOV_TOKEN }}

  test-e2e:
    runs-on: ${{ matrix.os }}
    needs: prepare-test-images
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 2

    - name: Download test image
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: docker-test-${{ matrix.arch }}
        path: /tmp

    - name: Load Docker image
      run: docker load < /tmp/borgitory-test-${{ matrix.arch }}.tar

    - name: Run e2e tests with coverage
      run: |
        docker run --rm \
          --cap-add SYS_ADMIN \
          --device /dev/fuse:/dev/fuse:rwm \
          -v $(pwd):/app \
          -w /app \
          borgitory-test-${{ matrix.arch }} \
          sh -c "pip install -e .[dev] && playwright install --with-deps chromium && pytest tests/e2e/ \
            --config-file tests/e2e/pytest.e2e.ini \
            --cov src/borgitory \
            --junitxml junit.xml \
            --cov-report xml:e2e-coverage.xml \
            --override-ini junit_family=legacy"

    - name: Upload e2e test coverage to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        flags: e2e
        name: e2e-tests
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload e2e test results to Codecov
      if: always() && matrix.arch == 'x86_64'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        flags: e2e
        name: e2e-tests-results
        report_type: test_results
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload Playwright traces and screenshots on failure
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: playwright-traces-and-screenshots-${{ matrix.arch }}
        path: test-results/
        retention-days: 7

  build-python-packages:
    runs-on: ${{ matrix.os }}
    needs: [code-quality-lint, code-quality-types, test-unit, test-integration, test-e2e]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: x86_64

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 2

    - name: Install system dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc \
          pkg-config \
          libfuse3-dev

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Build Tailwind CSS
      run: python build_tailwind.py

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package with twine
      run: twine check dist/*

    - name: Test package installation (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        python -m venv test_env
        source test_env/bin/activate

        pip install dist/*.whl

        borgitory --version
        borgitory --help

    - name: Test package installation (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        python -m venv test_env
        test_env\Scripts\Activate.ps1

        $whl = Get-ChildItem -Path "dist\*.whl" | Select-Object -First 1
        pip install $whl.FullName

        borgitory --version
        borgitory --help

  build-docker-images:
    runs-on: ${{ matrix.os }}
    needs: [code-quality-lint, code-quality-types, test-unit, test-integration, test-e2e]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build production image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: false
        load: false
        tags: borgitory-production-${{ matrix.arch }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
